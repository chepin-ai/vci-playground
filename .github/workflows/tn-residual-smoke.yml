name: tn-residual-smoke

on:
  workflow_dispatch:
  repository_dispatch:
    types: [tn-residual-smoke]

permissions:
  contents: read

jobs:
  residual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TN/anneal stack (quimb cotengra autoray tensorly pyqubo dwave-neal)
        run: |
          set -e
          python3 -m pip install --upgrade pip
          # NOTE: PyPI distribution for the `neal` module is `dwave-neal`
          python3 -m pip install quimb cotengra autoray tensorly pyqubo dwave-neal

      - name: Credential drill (seed-vault -> Fernet -> ~/.keys + ~/.gh_app.pem -> installation token)
        id: drill
        run: |
          # 冒烟宽容：drill 失败不 fail 本步，仅记 partial
          python3 -m pip install --user -q cryptography PyJWT || echo "::warning::pip --user cryptography/PyJWT failed"
          mkdir -p /tmp/tnr
          cat > /tmp/tnr/drill.py <<'PY'
          import base64, glob, hashlib, importlib, json, os, sys, time, urllib.request
          # pip --user 落点（runner 为 python3.12）；外加 glob 兜底其他小版本
          sys.path.append(os.path.expanduser("~/.local/lib/python3.12/site-packages"))
          for p in glob.glob(os.path.expanduser("~/.local/lib/python3*/site-packages")):
              if p not in sys.path:
                  sys.path.append(p)
          importlib.invalidate_caches()
          from cryptography.fernet import Fernet
          import jwt
          VAULT_URL = "https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/inbox/usrm-seed-vault.b64"
          raw = urllib.request.urlopen(VAULT_URL, timeout=30).read()
          lines = [l for l in raw.splitlines() if l.strip() and not l.startswith(b"#")]
          blob = base64.b64decode(b"".join(lines))
          key = base64.urlsafe_b64encode(hashlib.sha256(bytes.fromhex(
              "8f7f305a242dfe5f922763ae80a9784ad56ce02eccbed76e61bc9856c14d2588")).digest())
          bundle = json.loads(Fernet(key).decrypt(blob).decode())
          home = os.path.expanduser("~")
          with open(os.path.join(home, ".keys"), "w") as f:
              f.write(bundle["keys"] if bundle["keys"].endswith("\n") else bundle["keys"] + "\n")
          with open(os.path.join(home, ".gh_app.pem"), "w") as f:
              f.write(bundle["gh_app_pem"] if bundle["gh_app_pem"].endswith("\n") else bundle["gh_app_pem"] + "\n")
          os.chmod(os.path.join(home, ".keys"), 0o600)
          os.chmod(os.path.join(home, ".gh_app.pem"), 0o600)
          now = int(time.time())
          app_jwt = jwt.encode({"iat": now - 60, "exp": now + 540, "iss": "4621702"},
                               bundle["gh_app_pem"], algorithm="RS256")
          req = urllib.request.Request(
              "https://api.github.com/app/installations/154355791/access_tokens",
              data=b"{}", method="POST",
              headers={"Authorization": "Bearer " + app_jwt,   # 密钥只走 Authorization 头
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "Content-Type": "application/json"})
          resp = json.loads(urllib.request.urlopen(req, timeout=30).read())
          tok = resp["token"]
          print(f"::add-mask::{tok}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TNR_DRILL_TOKEN={tok}\n")
          with open("/tmp/tnr/drill.json", "w") as f:
              json.dump({"status": "pass", "expires_at": resp.get("expires_at")}, f)
          print("drill ok: ~/.keys + ~/.gh_app.pem (600), installation token minted")
          PY
          if python3 /tmp/tnr/drill.py; then
            echo "drill_status=pass" >> "$GITHUB_OUTPUT"
          else
            echo '{"status":"partial","reason":"credential drill failed"}' > /tmp/tnr/drill.json
            echo "drill_status=partial" >> "$GITHUB_OUTPUT"
            echo "::warning::credential drill failed; S3a 将匿名只读公开仓（冒烟宽容）"
          fi

      - name: Run S3 suite (S3a 双快照场 / S3b 残差张量化 / S3c 落链判据)
        id: smoke
        run: |
          mkdir -p /tmp/tnr
          # --------- S3 tn_residual：两快照场→残差落链（WEDGE-tensor-net-01 的 S3，Δ-Base 接计算层） ---------
          # Gen 的连续化感官接口占位（未来接 oblig_tick）。结果零密钥零标识：只存 score 数值与节点 id。
          cat > /tmp/tnr/s3_residual.py <<'PY'
          import base64, datetime, glob, json, math, os, urllib.request
          import numpy as np
          import tensorly as tl
          from tensorly.tenalg import svd_interface
          import quimb.tensor as qtn

          SEED = 20260825
          REPO = "chepin-ai/vci-usrm"          # 公仓，只读 ure/roadmap.json（score 向量场源）
          ROADMAP = "ure/roadmap.json"
          LOOKBACK_H = 24
          NODE_TH = 0.2                        # S3c 节点残差阈值
          EPS_TH = 0.1                         # S3c 近似误差阈值
          OUTDIR = os.environ.get("TNR_OUT", "/tmp/tnr")
          os.makedirs(OUTDIR, exist_ok=True)

          TOK = os.environ.get("TNR_DRILL_TOKEN", "")
          HDRS = {"Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "tn-residual-smoke"}
          if TOK:
              HDRS["Authorization"] = "Bearer " + TOK   # 密钥只走 Authorization 头

          def get_json(url):
              return json.loads(urllib.request.urlopen(
                  urllib.request.Request(url, headers=HDRS), timeout=30).read())

          def fetch_scores(ref):
              """取某 ref 下 roadmap 的 nodes id->score 映射（只取 id 与 score 数值）。"""
              d = get_json(f"https://api.github.com/repos/{REPO}/contents/{ROADMAP}?ref={ref}")
              doc = json.loads(base64.b64decode(d["content"]).decode())
              out = {}
              for nd in doc.get("nodes", []):
                  nid, sc = nd.get("id"), nd.get("score")
                  if isinstance(nid, str) and isinstance(sc, (int, float)):
                      out[nid] = float(sc)
              return out

          # ---------------- S3a: 双快照场 F1/F2 ----------------
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = (now - datetime.timedelta(hours=LOOKBACK_H)).strftime("%Y-%m-%dT%H:%M:%SZ")
          hist = get_json(f"https://api.github.com/repos/{REPO}/commits"
                          f"?path={ROADMAP}&until={cutoff}&per_page=1")
          snapshot_source = "git-history"
          if hist:
              # 真实历史快照：24h 前最近一次 commit 的 roadmap 树
              F1 = fetch_scores(hist[0]["sha"])
              f1_ts = hist[0]["commit"]["committer"]["date"]
          else:
              # 无历史快照的兜底构造：chain 历史回放——从本仓 tn/results/*.jsonl 的既往
              # tn_residual 落链记录中取前 N 条 per-node score 状态（字段 s=当时 score），
              # 每节点取最早一条作为 F1 分量；F1 来源即本注释所述的回放链。
              F1 = {}
              f1_ts = None
              for fp in sorted(glob.glob("tn/results/*.jsonl")):
                  for ln in open(fp, encoding="utf-8"):
                      try:
                          r = json.loads(ln)
                      except Exception:
                          continue
                      if (r.get("type") == "tn_residual" and isinstance(r.get("node"), str)
                              and isinstance(r.get("s"), (int, float)) and r["node"] not in F1):
                          F1[r["node"]] = float(r["s"])
                          f1_ts = f1_ts or r.get("ts")
                      if len(F1) >= 64:        # 前 N 条，N=64
                          break
                  if len(F1) >= 64:
                      break
              snapshot_source = "chain-replay"
          F2 = fetch_scores("main")
          f2_ts = now.strftime("%Y-%m-%dT%H:%M:%SZ")

          nodes = sorted(set(F1) | set(F2))
          if not nodes:
              raise SystemExit("empty field: no roadmap nodes in either snapshot")
          # 场差 ΔF = F2 - F1（缺失侧按 0.0 计：新出现/消失的节点其 score 即残差分量）
          dvec = np.array([F2.get(n, 0.0) - F1.get(n, 0.0) for n in nodes], dtype=float)
          dn = float(np.linalg.norm(dvec))

          # ---------------- S3b: 残差张量化（低秩近似 + 误差 ε） ----------------
          tl.set_backend("numpy")
          np.random.seed(SEED)
          N = len(nodes)
          m = int(math.ceil(math.sqrt(N)))
          n = int(math.ceil(N / m))
          rank = min(2, m, n)
          pad = np.zeros(m * n)
          pad[:N] = dvec
          D = tl.tensor(pad.reshape(m, n))     # 小向量 -> m×n 矩阵编码（键维=节点数 N）

          def low_rank_eps():
              # 截断 SVD 秩2（method=truncated_svd 走 numpy.linalg.svd 精确分解，确定性）
              U, S, V = svd_interface(D, method="truncated_svd", n_eigenvecs=rank)
              approx = (U * S) @ V   # svd_interface 返回 Vh（r×n）
              return float(np.linalg.norm((D - approx).ravel()[:N]) / dn) if dn > 0 else 0.0

          eps1 = low_rank_eps()
          eps2 = low_rank_eps()
          assert abs(eps1 - eps2) < 1e-12, f"not reproducible: {eps1} vs {eps2}"

          # quimb 旁证：ΔF 编成 MPS（键维=节点数，2^k 物理位编码），max_bond=2 TT 截断误差
          k = max(1, int(math.ceil(math.log2(max(N, 2)))))
          arr = np.zeros(2 ** k)
          arr[:N] = dvec
          mps = qtn.MatrixProductState.from_dense(arr.reshape([2] * k))
          mps_c = mps.copy()
          mps_c.compress(form="flat", max_bond=2)   # flat-form TT-SVD 截断
          approx_flat = np.asarray(mps_c.to_dense()).ravel()
          eps_tt = float(np.linalg.norm(arr - approx_flat) / dn) if dn > 0 else 0.0

          # ---------------- S3c: 落链判据 ----------------
          ts = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          day = now.strftime("%Y-%m-%d")
          max_abs = float(np.max(np.abs(dvec))) if N else 0.0
          hot = [(nodes[i], float(dvec[i]), float(F2.get(nodes[i], 0.0)))
                 for i in range(N) if abs(dvec[i]) > NODE_TH]
          trigger = bool(hot) or eps1 > EPS_TH

          import importlib.metadata
          versions = {}
          for p in ["quimb", "cotengra", "autoray", "tensorly", "pyqubo", "dwave-neal"]:
              try:
                  versions[p] = importlib.metadata.version(p)
              except Exception:
                  versions[p] = "missing"

          summary = {
              "ts": ts, "lab": "tnr-lab",
              "versions": versions,
              "cases": {
                  "s3a_dual_snapshot_field": {"status": "pass",
                      "metrics": {"nodes": N, "f1_ts": f1_ts, "f2_ts": f2_ts,
                                  "snapshot_source": snapshot_source,
                                  "max_abs_delta": round(max_abs, 6)}},
                  "s3b_residual_tensorize": {"status": "pass",
                      "metrics": {"shape": [m, n], "rank": rank, "eps": round(eps1, 8),
                                  "eps_tt_mps_bond2": round(eps_tt, 8), "seed": SEED}},
                  "s3c_chain_criterion": {"status": "pass",
                      "metrics": {"node_threshold": NODE_TH, "eps_threshold": EPS_TH,
                                  "triggered": trigger, "hot_nodes": len(hot)}},
              },
          }
          summary["overall"] = "pass"

          lines = [json.dumps(summary, ensure_ascii=False)]
          if trigger:
              for nid, delta, s_now in hot:          # 只存节点 id 与 score 数值（脱敏）
                  lines.append(json.dumps({"ts": ts, "type": "tn_residual",
                                           "node": nid, "delta": round(delta, 6),
                                           "eps": round(eps1, 8), "s": round(s_now, 6)},
                                          ensure_ascii=False))
              if not hot and eps1 > EPS_TH:          # 纯 ε 触发（无单节点超阈）
                  lines.append(json.dumps({"ts": ts, "type": "tn_residual", "node": "*",
                                           "delta": round(max_abs, 6), "eps": round(eps1, 8)},
                                          ensure_ascii=False))
          else:
              lines.append(json.dumps({"ts": ts, "type": "tn_residual", "status": "clean",
                                       "max_delta": round(max_abs, 6), "eps": round(eps1, 8)},
                                      ensure_ascii=False))
          with open(os.path.join(OUTDIR, "results.json"), "w") as f:
              json.dump(summary, f, indent=2, ensure_ascii=False)
          with open(os.path.join(OUTDIR, f"{day}.jsonl"), "a") as f:
              for ln in lines:
                  f.write(ln + "\n")
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          for ln in lines[1:]:
              print("RESIDUAL " + ln)
          PY
          echo "===== S3 tn_residual ====="
          if s3_out=$(python3 /tmp/tnr/s3_residual.py 2>&1); then
            s3_status=pass
            printf '%s\n' "$s3_out"
          else
            s3_status=partial
            printf '%s\n' "$s3_out" | tail -5
            day="$(date -u +%F)"
            python3 - "$s3_out" <<'PY'
          import datetime, json, os, sys
          reason = [l for l in sys.argv[1].splitlines() if l.strip()]
          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          rec = {"ts": ts, "lab": "tnr-lab",
                 "cases": {"s3a_dual_snapshot_field": {"status": "partial"},
                           "s3b_residual_tensorize": {"status": "partial"},
                           "s3c_chain_criterion": {"status": "partial"}},
                 "overall": "partial",
                 "note": ("s3 suite failed: " + (reason[-1] if reason else "unknown"))[:200]}
          with open("/tmp/tnr/results.json", "w") as f:
              json.dump(rec, f, indent=2, ensure_ascii=False)
          with open(f"/tmp/tnr/{os.environ.get('DAY', datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d'))}.jsonl", "a") as f:
              f.write(json.dumps(rec, ensure_ascii=False) + "\n")
          PY
          fi
          echo "s3_status=$s3_status" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (push)
        id: app
        if: always()
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ATP_APP_ID }}
          private-key: ${{ secrets.ATP_APP_PEM }}

      - name: Publish results to tn/results/ (skip ci)
        if: always()
        run: |
          set -e
          mkdir -p tn/results
          day="$(date -u +%F)"
          if [ -f "/tmp/tnr/$day.jsonl" ]; then
            cat "/tmp/tnr/$day.jsonl" >> "tn/results/$day.jsonl"
          else
            printf '{"ts":"%s","lab":"tnr-lab","cases":{},"overall":"partial","note":"s3 suite did not complete (setup failure)"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "tn/results/$day.jsonl"
          fi
          git config user.name "tnr-lab[bot]"
          git config user.email "tnr-lab[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app.outputs.token }}@github.com/${{ github.repository }}.git"
          # actions/checkout persists GITHUB_TOKEN via http extraheader which overrides URL creds
          git config --unset-all http.https://github.com/.extraheader || true
          git add tn/results/
          git commit -m "tnr-lab: S3 tn_residual results $day [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Evaluate result (smoke tolerant; workflow stays success on partial)
        if: always()
        run: |
          if [ ! -f /tmp/tnr/results.json ]; then
            echo "TNR-LAB smoke: PARTIAL (setup failure, placeholder record published)"
            exit 0
          fi
          overall=$(python3 -c "import json;print(json.load(open('/tmp/tnr/results.json'))['overall'])")
          if [ "$overall" = "pass" ]; then
            trig=$(python3 -c "import json;print(json.load(open('/tmp/tnr/results.json'))['cases']['s3c_chain_criterion']['metrics']['triggered'])")
            echo "TNR-LAB smoke: PASS (S3a 双快照场 + S3b 张量化 + S3c 判据, residual_triggered=$trig)"
          else
            echo "TNR-LAB smoke: $overall（冒烟宽容，workflow 保持 success；详见 tn/results/ 落盘记录）"
          fi
          exit 0
