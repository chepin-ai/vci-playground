name: bench-qlv
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: bench-qlv
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 门闸
        env:
          APPK: ${{ secrets.CI_OPS_HUB_KEY }}
        run: |
          if [ -z "$APPK" ]; then echo "IDLE: hub key 未落 vci-playground"; exit 0; fi
          echo "secrets 齐"
      - name: 取引擎+跑仿真+回写 qlv-lab（值不打印）
        env:
          APPK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          [ -n "$APPK" ] || exit 0
          set -e
          printf '%s' "$APPK" > /tmp/hub.pem
          pip install -q pyjwt cryptography qiskit-aer
          cat > /tmp/mint.py <<'PYE'
          import jwt,time,json,urllib.request,os
          now=int(time.time())
          t=jwt.encode({'iat':now-60,'exp':now+540,'iss':os.environ['HUB_ID']},open('/tmp/hub.pem').read(),algorithm='RS256')
          H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}
          inst=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/app/installations',headers=H)).read())
          iid=[i['id'] for i in inst if i['account']['login']=='chepin-ai'][0]
          r=urllib.request.Request('https://api.github.com/app/installations/%s/access_tokens'%iid,method='POST',headers=H); r.data=b'{}'
          print(json.loads(urllib.request.urlopen(r).read())['token'])
          PYE
          IT=$(python3 /tmp/mint.py)
          rm -f /tmp/hub.pem /tmp/mint.py
          git clone -q --depth 1 "https://x-access-token:${IT}@github.com/chepin-ai/qlv-lab.git" /tmp/qlv
          cd /tmp/qlv
          python3 - <<'PYE'
          import json,datetime
          from qiskit import QuantumCircuit
          from qiskit_aer import AerSimulator
          qc=QuantumCircuit(3,3); qc.h(0); qc.cx(0,1); qc.cx(1,2); qc.measure([0,1,2],[0,1,2])
          r=AerSimulator().run(qc,shots=2000).result().get_counts()
          res={'bench':'GHZ-3 aer','ts':datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%dT%H:%M:%SZ'),'shots':2000,'counts':r,'engine_present':__import__('os').path.exists('lines/qlv/engine/qlv_engine.py')}
          import os; os.makedirs('lines/qlv/bench',exist_ok=True)
          fn='lines/qlv/bench/bench-'+res['ts'].replace(':','')+'.json'
          json.dump(res,open(fn,'w'),ensure_ascii=False,indent=1)
          print('BENCH-FILE',fn)
          PYE
          git config user.name 'bench-qlv[bot]'; git config user.email 'bot@users.noreply.github.com'
          git add lines/qlv/bench/
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "bench-qlv: aer 仿真例行（公域 CI 代跑 qlv 外线研究）"
          for i in 1 2 3; do git pull --rebase -q origin main 2>/dev/null; git push -q && break; sleep 5; done
          echo "BENCH-OK $(date -u +%FT%TZ)"
