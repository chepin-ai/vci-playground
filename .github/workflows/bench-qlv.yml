name: bench-qlv
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: bench-qlv
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 作业卡驱动（空队即退，零空转）
        env:
          APPK: ${{ secrets.CI_OPS_LINE_KEY }}
          HUB_ID: ${{ vars.CI_OPS_LINE_ID }}
        run: |
          [ -n "$APPK" ] || { echo "IDLE: hub key 未落"; exit 0; }
          set -e
          printf '%s' "$APPK" > /tmp/hub.pem
          pip install -q pyjwt cryptography
          cat > /tmp/mint.py <<'PYE'
          import jwt,time,json,urllib.request,os
          now=int(time.time())
          t=jwt.encode({'iat':now-60,'exp':now+540,'iss':os.environ['HUB_ID']},open('/tmp/hub.pem').read(),algorithm='RS256')
          H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}
          inst=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/app/installations',headers=H)).read())
          iid=[i['id'] for i in inst if i['account']['login']=='chepin-ai'][0]
          r=urllib.request.Request('https://api.github.com/app/installations/%s/access_tokens'%iid,method='POST',headers=H); r.data=b'{}'
          print(json.loads(urllib.request.urlopen(r).read())['token'])
          PYE
          IT=$(python3 /tmp/mint.py); rm -f /tmp/hub.pem /tmp/mint.py
          # 轻量预查：空队即退（不装重依赖，零空转）
          QN=$(curl -s --max-time 20 -H "Authorization: Bearer ${IT}" "https://api.github.com/repos/chepin-ai/qlv-lab/contents/lines/qlv/bench/queue" | python3 -c "import sys,json
          try: print(len([f for f in json.load(sys.stdin) if f['name'].endswith('.json')]))
          except Exception: print(0)")
          echo "queued cards: ${QN}"
          [ "${QN}" != "0" ] || { echo "QUIET-EXIT 空队"; exit 0; }
          pip install -q qiskit-aer
          pip install -q cqlib || echo "cqlib 安装失败（后端卡将标记）"
          git clone -q --depth 1 "https://x-access-token:${IT}@github.com/chepin-ai/qlv-lab.git" /tmp/qlv
          cd /tmp/qlv
          python3 - <<'PYE'
          import json,os,glob,datetime,traceback
          from qiskit import QuantumCircuit
          from qiskit_aer import AerSimulator
          TS=datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%dT%H:%M:%SZ')
          os.makedirs('lines/qlv/bench/results',exist_ok=True); os.makedirs('lines/qlv/bench/done',exist_ok=True)
          for card in sorted(glob.glob('lines/qlv/bench/queue/*.json')):
              try:
                  job=json.load(open(card)); jid=job['job_id']
                  kind=job.get('circuit','ghz'); n=int(job.get('qubits',3)); shots=int(job.get('shots',2000))
                  if kind=='ghz':
                      qc=QuantumCircuit(n,n); qc.h(0)
                      for i in range(n-1): qc.cx(i,i+1)
                      qc.measure(range(n),range(n))
                  elif kind=='qasm':
                      qc=QuantumCircuit.from_qasm_str(job['qasm'])
                  else:
                      raise ValueError('unknown circuit '+kind)
                  r=AerSimulator().run(qc,shots=shots).result().get_counts()
                  res={'job_id':jid,'ts':TS,'backend':'aer','shots':shots,'counts':r,'ok':True,'note':job.get('note','')}
              except Exception as e:
                  res={'job_id':job.get('job_id','?'),'ts':TS,'ok':False,'error':str(e)[:200]}
                  jid=res['job_id']
              json.dump(res,open('lines/qlv/bench/results/%s.json'%jid,'w'),ensure_ascii=False,indent=1)
              os.rename(card,'lines/qlv/bench/done/%s'%os.path.basename(card))
              print('CARD-DONE',jid,res.get('ok'))
          PYE
          git config user.name 'bench-qlv[bot]'; git config user.email 'bot@users.noreply.github.com'
          git add lines/qlv/bench/
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "bench-qlv: 作业卡执行轮"
          for i in 1 2 3; do git pull --rebase -q origin main 2>/dev/null; git push -q && break; sleep 5; done
          echo "BENCH-OK $(date -u +%FT%TZ)"
