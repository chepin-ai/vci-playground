name: kaggle-distributor
on:
  workflow_dispatch:
    inputs:
      target: {description: '目标仓', required: true}
permissions:
  contents: write
jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: transfer 2 kaggle keys (runner内读源→hub权写目标;值永不打印)
        env:
          K1: ${{ secrets.API_KAGGLE_CRED_1 }}
          K2: ${{ secrets.API_KAGGLE_TOKEN_3 }}
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          pip -q install pyjwt pynacl
          python3 - <<'PYEOF'
          import jwt,time,json,os,urllib.request,base64
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUB_ID']},os.environ['HUB_KEY'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'})
          IT=json.load(urllib.request.urlopen(rq))['token']
          B='https://api.github.com/repos/chepin-ai'
          T=os.environ['TARGET']
          import nacl.public, nacl.encoding
          def gh(m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              if d is not None: r.data=json.dumps(d).encode(); r.add_header('Content-Type','application/json')
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,{}
          s,pk=gh('GET',f'{B}/{T}/actions/secrets/public-key')
          box=nacl.public.SealedBox(nacl.public.PublicKey(pk['key'].encode(),nacl.encoding.Base64Encoder))
          out={}
          for nm,val in [('API_KAGGLE_CRED_1',os.environ['K1']),('API_KAGGLE_TOKEN_3',os.environ['K2'])]:
              ct=box.encrypt(val.encode())
              s1,_=gh('PUT',f'{B}/{T}/actions/secrets/{nm}',{'encrypted_value':base64.b64encode(ct).decode(),'key_id':pk['key_id']})
              out[nm]=s1
          print(json.dumps({'target':T,'res':out}))
          PYEOF
